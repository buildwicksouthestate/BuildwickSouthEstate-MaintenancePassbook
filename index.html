<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Passbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ff;--surface:#fff;--ink:#18202f;--muted:#697386;--line:#e4e0ef;
  --blue:#4263eb;--purple:#8b5cf6;--green:#16a34a;--red:#ef4444;
  --green-bg:#e9f9ef;--red-bg:#fff0f0;--purple-bg:#f1eaff;
  --orange:#f59e0b;--shadow:0 12px 35px rgba(57,42,120,.10);
  --serif:'Lora',serif;--sans:'Inter',sans-serif
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink);
background:radial-gradient(circle at 8% 0%,#e8e2ff 0,transparent 28%),
radial-gradient(circle at 100% 10%,#dff8ff 0,transparent 25%),var(--bg)}
body{padding:24px}
.app-shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.sidebar,.main-card{background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px}
.sidebar{position:sticky;top:24px;padding:20px;max-height:calc(100vh - 48px);overflow:auto}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--purple));
color:white;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 18px rgba(66,99,235,.25)}
.brand h1{font-family:var(--serif);font-size:18px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.side-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:10px 0}
.year{margin-bottom:10px}.year-head{width:100%;border:0;background:#f5f3ff;color:var(--ink);padding:11px 12px;border-radius:12px;
display:flex;justify-content:space-between;align-items:center;font-weight:800;cursor:pointer}.year-head .arrow{transition:.2s}
.year.collapsed .arrow{transform:rotate(-90deg)}.months{padding:7px 0 0 8px}.year.collapsed .months{display:none}
.month-btn{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;text-align:left;
padding:10px 11px;border-radius:10px;color:#596273;cursor:pointer;font-size:13px}.month-btn:hover{background:#f1efff;color:var(--blue)}
.month-btn.active{background:linear-gradient(90deg,#e9e7ff,#f3edff);color:#4935b9;font-weight:800;box-shadow:inset 3px 0 #7c5cff}
.month-btn .mini-total{font-size:10px;color:var(--muted);font-weight:600}
.main-card{padding:26px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.topbar h2{font-family:var(--serif);font-size:27px;margin:0 0 5px}.topbar p{margin:0;color:var(--muted);font-size:13px}.asof{font-size:11px;color:var(--muted);white-space:nowrap}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{border-radius:15px;padding:16px 17px;border:1px solid var(--line);position:relative;overflow:hidden}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.stat .value{font-size:22px;font-weight:800;margin-top:5px}.stat.collected{background:linear-gradient(135deg,#eafff0,#f6fff9)}
.stat.spent{background:linear-gradient(135deg,#fff7e8,#fffaf3)}.stat.balance{background:linear-gradient(135deg,#eeeaff,#f8f4ff)}
.legend{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin:4px 0 14px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.green{background:var(--green)}.dot.red{background:var(--red)}.dot.purple{background:var(--purple)}
.unit-heading{display:flex;justify-content:space-between;align-items:end;margin:18px 0 10px}.unit-heading h3{margin:0;font-size:15px}
.unit-heading small{color:var(--muted);font-size:11px}
.unit-grid{display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));gap:10px}
.unit-card{border:2px solid transparent;border-radius:14px;padding:12px;min-height:96px;position:relative;
transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(30,32,60,.06)}
.unit-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,32,60,.10)}
.unit-card.paid{background:var(--green-bg);border-color:#8ce0aa}.unit-card.pending{background:var(--red-bg);border-color:#ffaaa7}
.unit-card.reimburse{background:var(--purple-bg);border-color:#c4a7ff}
.unit-no{font-weight:800;font-size:16px}.status-pill{float:right;font-size:9px;text-transform:uppercase;letter-spacing:.05em;
font-weight:800;padding:4px 6px;border-radius:99px;background:rgba(255,255,255,.72)}
.unit-card.paid .status-pill{color:#08752f}.unit-card.pending .status-pill{color:#b42318}.unit-card.reimburse .status-pill{color:#6333c5}
.unit-amount{font-size:15px;font-weight:800;margin-top:13px}.unit-due{font-size:10px;color:var(--muted);margin-top:3px}
.reimburse-note{font-size:10px;color:#6333c5;margin-top:5px;font-weight:700}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:28px 0 9px}
.expenses{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.expense-row{display:grid;grid-template-columns:1fr auto;gap:15px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.expense-row:last-child{border-bottom:0}.expense-main{font-weight:700}.expense-main .cat{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px}
.expense-amount{font-weight:800;white-space:nowrap}.tag{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:99px;font-size:9px;background:#f0e9ff;color:#663bc3}
.invoice{font-size:10px;color:var(--blue);display:inline-block;margin-top:4px}.empty{padding:45px 15px;text-align:center;color:var(--muted);font-size:13px}
.reimbursement-banner{padding:13px 15px;border-radius:14px;background:linear-gradient(90deg,#f0eaff,#fff);
border:1px solid #d4c1ff;color:#5e3bb4;font-size:12px;margin-bottom:18px}.reimbursement-banner strong{font-size:15px}
.config-note{padding:10px 12px;background:#fff8e8;border:1px solid #f4d58e;border-radius:10px;font-size:11px;color:#805d17;margin-bottom:15px}
@media(max-width:900px){body{padding:12px}.app-shell{grid-template-columns:1fr}.sidebar{position:relative;top:auto;max-height:none}.unit-grid{grid-template-columns:repeat(4,minmax(100px,1fr))}}
@media(max-width:620px){.main-card{padding:18px}.summary{grid-template-columns:1fr}.unit-grid{grid-template-columns:repeat(2,1fr)}
.topbar{display:block}.asof{margin-top:8px}.unit-card{min-height:88px}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">₹</div>
      <div><h1 id="sideBuildingName">Building Passbook</h1><small>Interactive view only</small></div>
    </div>
    <div class="side-title">Years & months</div>
    <div id="yearMonthNav"><div class="empty" style="padding:20px 5px">Loading…</div></div>
  </aside>

  <main class="main-card">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Building Passbook</h2>
        <p id="pageSubtitle">Select a month from the left to view unit payment status.</p>
      </div>
      <div class="asof" id="asOf"></div>
    </div>
    <div id="configNote" class="config-note" style="display:none">
      Set <code>API_URL</code> to your deployed Apps Script <code>/exec</code> URL.
    </div>
    <div id="content"><div class="empty">Loading data…</div></div>
  </main>
</div>

</html>
