<style>
:root{
  --bg:#f3f0ff;--surface:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e0f3;
  --blue:#4263eb;--purple:#7c3aed;--green:#16a34a;--red:#ef4444;--orange:#f59e0b;
  --greenBg:#eafaf0;--redBg:#fff0f1;--purpleBg:#f2eaff;--blueBg:#eef2ff;
  --shadow:0 14px 38px rgba(58,42,130,.11);--serif:'Lora',serif;--sans:'Inter',sans-serif
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:22px;font-family:var(--sans);color:var(--ink);background:

.app{max-width:1360px;margin:auto;display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.sidebar,.main{background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px}.sidebar{position:sticky;top:22px;max-height:calc(100vh - 44px);overflow:auto;padding:18px}
.brand{display:flex;align-items:center;gap:11px;margin:2px 2px 22px}.brandMark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(135deg,#4263eb,#8b5cf6);box-shadow:0 10px 22px rgba(66,99,235,.25)}
.brandLogo{display:block;width:100%;max-width:270px;height:150px;object-fit:contain;object-position:left center}.brandSub{margin-top:-4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.sideTitle{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--muted);margin:8px 10px 10px}
.year{margin-bottom:9px}.yearHead{width:100%;border:0;background:#f5f3ff;border-radius:12px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;font-weight:800;color:#20283a;cursor:pointer}.yearHead:hover{background:#eeeaff}.yearArrow{transition:.2s}.year.collapsed .yearArrow{transform:rotate(-90deg)}.year.collapsed .months{display:none}
.month{margin-top:6px}.monthHead{width:100%;border:0;background:transparent;border-radius:11px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:#4d586b;cursor:pointer;font-size:12px}.monthHead:hover{background:#f4f1ff;color:#4935b9}.monthHead.active{background:linear-gradient(90deg,#e9e7ff,#f3edff);color:#4935b9;font-weight:800}.monthArrow{font-size:10px;transition:.2s}.month.open .monthArrow{transform:rotate(90deg)}
.monthSections{display:none;padding:3px 0 6px 16px}.month.open .monthSections{display:block}.sectionBtn{width:100%;border:0;background:transparent;border-radius:9px;padding:8px 8px;display:flex;align-items:center;gap:8px;text-align:left;color:#667085;font-size:11px;cursor:pointer}.sectionBtn:hover{background:#f7f5ff;color:#4935b9}.sectionIcon{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800}.sectionBtn.maintenance .sectionIcon{background:#d9f8e4;color:#08752f}.sectionBtn.expenses .sectionIcon{background:#ffe0e2;color:#b42318}.sectionBtn.reimbursements .sectionIcon{background:#eadcff;color:#6333c5}.sectionCount{margin-left:auto;font-size:9px;color:var(--muted);font-weight:700}
.main{padding:25px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.top h2{font-family:var(--serif);font-size:28px;margin:0 0 4px}.top p{margin:0;color:var(--muted);font-size:12px}.asof{font-size:10px;color:var(--muted);white-space:nowrap}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:15px 17px;border-radius:15px;border:1px solid var(--line);position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-25px;top:-30px;opacity:.18}.stat .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}.stat .value{font-size:22px;font-weight:800;margin-top:5px}.stat .sub{font-size:10px;color:var(--muted);margin-top:3px}.stat.green{background:linear-gradient(135deg,#e8faef,#fbfffc);border-color:#bcebcf}.stat.red{background:linear-gradient(135deg,#fff0f1,#fffafa);border-color:#ffd0d4}.stat.purple{background:linear-gradient(135deg,#f0eaff,#fbf9ff);border-color:#dccbff}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted);margin-bottom:13px}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:3px}.dot.green{background:var(--green)}.dot.red{background:var(--red)}.dot.purple{background:var(--purple)}
.unitsTitle{display:flex;justify-content:space-between;align-items:end;margin:12px 0 8px}.unitsTitle h3{margin:0;font-size:15px}.unitsTitle small{color:var(--muted);font-size:10px}.floor{margin:18px 0 22px}.floorLabel{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#ece8ff,#f8f6ff);border-radius:11px;padding:8px 11px;color:#4435a5;font-size:12px;font-weight:800;margin-bottom:9px}.floorLabel:after{content:"";height:1px;flex:1;background:#ddd6fe}.floorCount{margin-left:auto;color:var(--muted);font-size:9px;font-weight:600}.unitGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.unitCard{min-height:150px;border-radius:15px;padding:12px;position:relative;overflow:hidden;box-shadow:0 5px 15px rgba(30,32,60,.06);border:1.5px solid transparent}.unitCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}.unitCard.paid{background:linear-gradient(145deg,#e9faef,#fbfffc);border-color:#b9e9cb}.unitCard.pending{background:linear-gradient(145deg,#fff0f1,#fffafa);border-color:#ffd0d4}.unitCard.reimburse{background:linear-gradient(145deg,#f1eaff,#fcfaff);border-color:#d8c4ff}.unitCard.partial{background:linear-gradient(145deg,#fff8e7,#fffdf7);border-color:#f9d890}.unitCard.paid:before{background:var(--green)}.unitCard.pending:before,.unitCard.partial:before{background:var(--red)}.unitCard.reimburse:before{background:var(--purple)}
.unitTop{display:flex;justify-content:space-between;gap:5px;align-items:center}.unitNo{font-weight:800;font-size:16px}.pill{font-size:8px;font-weight:800;text-transform:uppercase;padding:4px 6px;border-radius:99px;background:rgba(255,255,255,.75)}.paid .pill{color:#08752f}.pending .pill,.partial .pill{color:#b42318}.reimburse .pill{color:#6333c5}.owner{font-size:10px;font-weight:700;color:#4b5563;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progressMeta{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-top:13px;margin-bottom:5px}.track{height:7px;background:rgba(255,255,255,.9);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}.fill{height:100%;border-radius:99px}.paid .fill{background:linear-gradient(90deg,#16a34a,#4ade80)}.pending .fill,.partial .fill{background:linear-gradient(90deg,#ef4444,#fb7185)}.reimburse .fill{background:linear-gradient(90deg,#8b5cf6,#c084fc)}.amount{font-size:13px;font-weight:800;margin-top:9px}.due{font-size:9px;color:var(--muted);margin-top:2px}.reimNote{font-size:9px;color:#6333c5;font-weight:700;margin-top:5px}
.bottomGrid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:12px;margin-top:12px}.panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.panelHead{padding:11px 12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800}.panelHead.green{background:#effcf3;color:#08752f}.panelHead.red{background:#fff2f3;color:#b42318}.panelHead.purple{background:#f5f0ff;color:#6333c5}.panelCount{font-size:9px;font-weight:700;color:var(--muted)}.table{width:100%;border-collapse:collapse;font-size:9px}.table th,.table td{padding:8px 9px;border-top:1px solid #eeeaf5;text-align:left}.table th{font-size:8px;color:var(--muted);font-weight:700}.right{text-align:right!important}.statusTiny{display:inline-block;padding:3px 6px;border-radius:99px;font-size:8px;font-weight:800}.statusTiny.paid{background:#daf5e4;color:#08752f}.statusTiny.partial{background:#fff0c9;color:#8a5a00}.statusTiny.pending{background:#ffe0e2;color:#b42318}.statusTiny.reimburse{background:#eadcff;color:#6333c5}.totalRow{font-weight:800}.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:11px}.error{padding:16px;border-radius:12px;background:#fff0f1;color:#9f1239;font-size:11px}.anchor{scroll-margin-top:18px}

.detailView{animation:fadeIn .2s ease}.detailHead{display:flex;align-items:center;gap:12px;margin-bottom:18px}.backBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:800;color:#4935b9}.backBtn:hover{background:#f5f3ff}.detailTitle h3{margin:0;font-family:var(--serif);font-size:22px}.detailTitle p{margin:3px 0 0;color:var(--muted);font-size:11px}.detailSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.detailStat{padding:14px;border-radius:13px;border:1px solid var(--line);background:#fff}.detailStat .k{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.detailStat .v{font-size:19px;font-weight:800;margin-top:5px}.detailCard{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(30,32,60,.05);margin-bottom:13px}.detailCardHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.detailCardHead h4{margin:0;font-size:13px}.detailCardHead small{color:var(--muted);font-size:9px}.detailGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.detailField{padding:12px 15px;border-bottom:1px solid #eeeaf5}.detailField .label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:4px}.detailField .value{font-size:11px;font-weight:700;word-break:break-word}.detailField.wide{grid-column:span 2}.detailActions{padding:11px 15px;display:flex;gap:8px;flex-wrap:wrap;background:#faf9ff}.docBtn{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;text-decoration:none;font-size:9px;font-weight:800;border:1px solid #cfc4ff;background:#f2ecff;color:#5b21b6}.docBtn:hover{background:#e8ddff}.noDoc{font-size:9px;color:var(--muted);padding:7px 0}.statusBadge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:9px;font-weight:800}.statusBadge.pending{background:#ffe0e2;color:#b42318}.statusBadge.closed{background:#d9f8e4;color:#08752f}.statusBadge.partial{background:#fff0c9;color:#8a5a00}.cellSub{font-size:8px;color:var(--muted);margin-top:3px}.greenStat{background:#f0fcf4}.redStat{background:#fff3f4}.detailTableWrap{overflow:auto}.detailTable{width:100%;border-collapse:collapse;min-width:820px;font-size:10px}.detailTable th,.detailTable td{padding:10px 11px;border-bottom:1px solid #eeeaf5;text-align:left;vertical-align:top}.detailTable th{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:#faf9ff;position:sticky;top:0}.detailTable tr:hover td{background:#fbfaff}.right{text-align:right!important}.rowDoc{white-space:nowrap}.rowDoc .docBtn{padding:5px 8px}.detailEmpty{padding:32px;text-align:center;color:var(--muted);font-size:11px}@keyframes fadeIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:1050px){.app{grid-template-columns:245px 1fr}.unitGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.bottomGrid{grid-template-columns:1fr 1fr}.bottomGrid .panel:last-child{grid-column:1/-1}}
@media(max-width:760px){body{padding:10px}.app{grid-template-columns:1fr}.sidebar{position:relative;top:auto;max-height:none}.summary{grid-template-columns:1fr}.unitGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottomGrid{grid-template-columns:1fr}.bottomGrid .panel:last-child{grid-column:auto}.top{display:block}.asof{margin-top:7px}.main{padding:17px}}
</style>
<style>
.balanceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.balanceCard{padding:15px;border-radius:14px;border:1px solid var(--line);background:#fff}
.balanceCard .k{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.balanceCard .v{font-size:21px;font-weight:800;margin-top:5px}
.balanceCard.opening{background:#eef2ff;border-color:#cdd6ff}.balanceCard.received{background:#effcf3;border-color:#bcebcf}.balanceCard.spent{background:#fff2f3;border-color:#ffd0d4}.balanceCard.closing{background:#f5f0ff;border-color:#d8c4ff}
.yearTable{width:100%;border-collapse:collapse;font-size:10px}.yearTable th,.yearTable td{padding:10px 11px;border-bottom:1px solid #eeeaf5;text-align:left}.yearTable th{font-size:8px;color:var(--muted);text-transform:uppercase;background:#faf9ff}.yearTable .total{font-weight:800;background:#faf9ff}

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz7OyA6ui12soiNWDvU2ckB_jI-wPv3RL-iD0Gyo5ho4sPt5F10gkOyRN4bvAC_8Z_tQA/exec';
let DATA=null, selectedKey='';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function monthKey(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0');
  if(v==null||v==='') return '';
  const s=String(v).trim(), low=s.toLowerCase();
  let m=s.match(/^(\d{4})[-\/]([0-9]{1,2})/); if(m) return m[1]+'-'+String(m[2]).padStart(2,'0');
  m=s.match(/^([0-9]{1,2})[-\/]([0-9]{1,2})[-\/](\d{4})$/); if(m) return m[3]+'-'+String(m[2]).padStart(2,'0');
  const names={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
  const parts=low.replace(/,/g,' ').split(/\s+/), y=parts.find(x=>/^\d{4}$/.test(x)), mn=parts.find(x=>names[x]);
  if(y&&mn) return y+'-'+String(names[mn]).padStart(2,'0');
  const d=new Date(s); return isNaN(d)?s:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(k){const m=String(k||'').match(/^(\d{4})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}):String(k||'Unknown month')}
function getMonth(k){return DATA.monthly.find(x=>x.key===k)}
function nav(){
  const groups={};
  DATA.monthly.forEach(m=>{(groups[m.year]??=[]).push(m)});
  const years=Object.keys(groups).sort((a,b)=>Number(b)-Number(a));
  if(!years.length){document.getElementById('nav').innerHTML='<div class="empty">No months found.</div>';return}
  document.getElementById('nav').innerHTML=years.map(y=>`<div class="year" id="year-${y}"><button class="yearHead" onclick="showYear('${y}')"><span>${esc(y)}</span><span class="yearArrow">▼</span></button><div class="months">${groups[y].sort((a,b)=>b.key.localeCompare(a.key)).map(m=>monthHtml(m)).join('')}</div></div>`).join('');
}
function monthHtml(m){
  const open=selectedKey===m.key?'open':''; const maint=m.unitStatus?.length||0, exp=m.expenses?.length||0, rei=m.reimbursements?.length||0;
  return `<div class="month ${open}" id="month-${m.key}"><button class="monthHead ${selectedKey===m.key?'active':''}" onclick="selectMonth('${m.key}')"><span>▣ &nbsp;${esc(m.label)}</span><span class="monthArrow">›</span></button><div class="monthSections">
  <button class="sectionBtn maintenance" onclick="event.stopPropagation();showSection('maintenance')"><span class="sectionIcon">✓</span><span>Maintenance Received</span><span class="sectionCount">${maint}</span></button>
  <button class="sectionBtn expenses" onclick="event.stopPropagation();showSection('expenses')"><span class="sectionIcon">₹</span><span>Expenses Incurred</span><span class="sectionCount">${exp}</span></button>
  <button class="sectionBtn reimbursements" onclick="event.stopPropagation();showSection('reimbursements')"><span class="sectionIcon">↗</span><span>Reimbursements</span><span class="sectionCount">${rei}</span></button>
  </div></div>`;
}
function toggleYear(y){document.getElementById('year-'+y).classList.toggle('collapsed')}
function showYear(y){selectedKey='';nav();const rows=(DATA.monthly||[]).filter(m=>String(m.year)===String(y)).sort((a,b)=>a.key.localeCompare(b.key));renderYear(y,rows);window.scrollTo({top:0,behavior:'smooth'})}
function selectMonth(k){selectedKey=k;nav();render(getMonth(k));window.scrollTo({top:0,behavior:'smooth'})}
function showSection(id){const m=getMonth(selectedKey); if(!m)return; if(id==='maintenance'||id==='expenses'||id==='reimbursements'){renderDetail(m,id);window.scrollTo({top:0,behavior:'smooth'});return} const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function unitInfo(m,n){return (m.unitStatus||[]).find(x=>String(x.unit).trim()===String(n).trim())||null}
function reimbursementFor(m,n){return (m.reimbursements||[]).find(r=>String(r.unit||'').trim().toLowerCase()===String(n).trim().toLowerCase()&&String(r.status).toLowerCase()!=='closed')||null}
function owner(u){return u.OwnerName||u.ownerName||u.Owner||u.owner||u.HolderName||u.holderName||u.Name||u.name||'Owner name not set'}
function floor(u,n){return u.Floor||u.floor||u.FloorNo||u.floorNo||u.FloorNumber||u.floorNumber||String(n).match(/^(\d+)/)?.[1]||'Other'}
function card(u,m){
  const n=u.UnitNo||u.unit||'', s=unitInfo(m,n), r=reimbursementFor(m,n); const due=Number(s?.due)||0, paid=Number(s?.paid)||0; const pct=due?Math.min(100,Math.round(paid/due*100)):0;
  const cls=r?'reimburse':(pct>=100&&due>0?'paid':paid>0?'partial':'pending'); const lab=r?'Reimbursement':(pct>=100&&due>0?'Paid':paid>0?'Partial':'Pending');
  return `<div class="unitCard ${cls}"><div class="unitTop"><span class="unitNo">${esc(n)}</span><span class="pill">${lab}</span></div><div class="owner">${esc(owner(u))}</div><div class="progressMeta"><span>${pct}% paid</span><span>${money(paid)} / ${money(due)}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="amount">${money(paid)} paid</div><div class="due">${due?money(due)+' monthly due':'No maintenance entry'}</div>${r?`<div class="reimNote">↗ ${money(r.amount)} reimbursement needed</div>`:''}</div>`;
}
function units(m){
  const all=DATA.units||[]; if(!all.length)return '<div class="empty">No units found in Units sheet.</div>';
  const groups={}; all.forEach(u=>{const n=u.UnitNo||u.unit||'';const f=String(floor(u,n));(groups[f]??=[]).push(u)});
  return Object.keys(groups).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(f=>`<section class="floor"><div class="floorLabel">▥ &nbsp;Floor ${esc(f)}<span class="floorCount">${groups[f].length} / 5 Units</span></div><div class="unitGrid">${groups[f].sort((a,b)=>String(a.UnitNo||a.unit||'').localeCompare(String(b.UnitNo||b.unit||''),undefined,{numeric:true})).map(u=>card(u,m)).join('')}</div></section>`).join('');
}
function maintenancePanel(m){
  const rows=(m.unitStatus||[]).slice().sort((a,b)=>String(a.unit).localeCompare(String(b.unit),undefined,{numeric:true}));
  if(!rows.length)return '<div class="panel anchor" id="maintenance"><div class="panelHead green">Maintenance Received <span class="panelCount">0 entries</span></div><div class="empty">No maintenance records for this month.</div></div>';
  return `<div class="panel anchor" id="maintenance"><div class="panelHead green">Maintenance Received <span class="panelCount">${rows.length} entries</span></div><table class="table"><thead><tr><th>Unit</th><th>Due</th><th>Paid</th><th>Status</th></tr></thead><tbody>${rows.map(r=>{const due=+r.due||0,paid=+r.paid||0,st=paid>=due&&due>0?'Paid':paid>0?'Partial':'Pending';return `<tr><td><b>${esc(r.unit)}</b></td><td>${money(due)}</td><td>${money(paid)}</td><td><span class="statusTiny ${st.toLowerCase()}">${st}</span></td></tr>`}).join('')}</tbody></table></div>`;
}
function expensesPanel(m){
  const rows=m.expenses||[]; const total=rows.reduce((s,x)=>s+(+x.Amount||0),0);
  return `<div class="panel anchor" id="expenses"><div class="panelHead red">Expenses Incurred <span class="panelCount">${rows.length} entries</span></div>${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Description</th><th class="right">Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(shortDate(x.Date))}</td><td>${esc(x.Description||x.Category||'Expense')}</td><td class="right">${money(x.Amount)}</td></tr>`).join('')}<tr class="totalRow"><td colspan="2">Total Expenses</td><td class="right">${money(total)}</td></tr></tbody></table>`:'<div class="empty">No expenses recorded.</div>'}</div>`;
}
function reimbursePanel(m){
  const rows=m.reimbursements||[], pending=rows.filter(x=>String(x.status).toLowerCase()!=='closed'), total=pending.reduce((s,x)=>s+(+x.amount||0),0);
  return `<div class="panel anchor" id="reimbursements"><div class="panelHead purple">Reimbursements <span class="panelCount">${pending.length} pending · ${rows.length-pending.length} closed</span></div>${rows.length?`<table class="table"><thead><tr><th>Unit</th><th>Paid By</th><th class="right">Amount</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.unit||'—')}</b></td><td>${esc(x.paidFrom||'—')}</td><td class="right">${money(x.amount)}</td><td><span class="statusTiny ${String(x.status).toLowerCase()==='closed'?'paid':'reimburse'}">${esc(x.status||'Pending')}</span></td></tr>`).join('')}<tr class="totalRow"><td colspan="2">Total Pending</td><td class="right">${money(total)}</td><td></td></tr></tbody></table>`:'<div class="empty">No reimbursements recorded.</div>'}</div>`;
}
function docButton(link,label='View document'){return link?`<a class="docBtn" href="${esc(link)}" target="_blank" rel="noopener">▣ ${esc(label)}</a>`:'<span class="noDoc">No document attached</span>'}
function expenseDetailCard(x,i){
  const isResident=x.PaidFrom&&String(x.PaidFrom).trim().toLowerCase()!=='fund';
  const rs=String(x.ReimbursementStatus||'').trim().toLowerCase();
  const status=rs==='settled'||rs==='closed'?'Closed':'Pending';
  return `<div class="detailCard"><div class="detailCardHead"><h4>Expense #${i+1} — ${esc(x.Description||x.Category||'Expense')}</h4><small>${esc(shortDate(x.Date))}</small></div><div class="detailGrid">
  <div class="detailField"><div class="label">Date</div><div class="value">${esc(shortDate(x.Date))}</div></div>
  <div class="detailField"><div class="label">Month</div><div class="value">${esc(x.Month||'')}</div></div>
  <div class="detailField"><div class="label">Category</div><div class="value">${esc(x.Category||'—')}</div></div>
  <div class="detailField"><div class="label">Amount</div><div class="value">${money(x.Amount)}</div></div>
  <div class="detailField wide"><div class="label">Description</div><div class="value">${esc(x.Description||'—')}</div></div>
  <div class="detailField"><div class="label">Paid From</div><div class="value">${esc(x.PaidFrom||'Fund')}</div></div>
  <div class="detailField"><div class="label">Reimbursement Status</div><div class="value">${isResident?`<span class="statusBadge ${status==='Closed'?'closed':'pending'}">${status}</span>`:'Not applicable'}</div></div>
  </div><div class="detailActions">${docButton(x.InvoiceLink,'View attached document')}</div></div>`;
}
function expenseDetails(m){
  const rows=m.expenses||[], total=rows.reduce((s,x)=>s+(+x.Amount||0),0);
  return `<div class="detailView"><div class="detailHead"><button class="backBtn" onclick="render(getMonth(selectedKey))">← Back to dashboard</button><div class="detailTitle"><h3>Expenses Incurred</h3><p>${esc(m.label)} · Complete expense details</p></div></div><div class="detailSummary"><div class="detailStat"><div class="k">Total expenses</div><div class="v">${money(total)}</div></div><div class="detailStat"><div class="k">Expense entries</div><div class="v">${rows.length}</div></div><div class="detailStat"><div class="k">Documents</div><div class="v">${rows.filter(x=>x.InvoiceLink).length}</div></div></div>${rows.length?rows.map(expenseDetailCard).join(''):'<div class="detailCard"><div class="detailEmpty">No expenses recorded for this month.</div></div>'}</div>`;
}
function reimbursementDetails(m){
  const rows=m.reimbursements||[], pending=rows.filter(x=>String(x.status).toLowerCase()!=='closed'), closed=rows.filter(x=>String(x.status).toLowerCase()==='closed');
  const pendingTotal=pending.reduce((s,x)=>s+(+x.amount||0),0), closedTotal=closed.reduce((s,x)=>s+(+x.amount||0),0);
  return `<div class="detailView"><div class="detailHead"><button class="backBtn" onclick="render(getMonth(selectedKey))">← Back to dashboard</button><div class="detailTitle"><h3>Reimbursements</h3><p>${esc(m.label)} · Pending and closed reimbursement details</p></div></div><div class="detailSummary"><div class="detailStat"><div class="k">Pending</div><div class="v">${money(pendingTotal)}</div></div><div class="detailStat"><div class="k">Closed</div><div class="v">${money(closedTotal)}</div></div><div class="detailStat"><div class="k">Total cases</div><div class="v">${rows.length}</div></div></div><div class="detailCard"><div class="detailCardHead"><h4>All Reimbursements</h4><small>${rows.length} records</small></div>${rows.length?`<div class="detailTableWrap"><table class="detailTable"><thead><tr><th>Date</th><th>Unit</th><th>Paid By</th><th>Category</th><th>Description</th><th>Amount</th><th>Status</th><th>Document</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(shortDate(x.date))}</td><td><b>${esc(x.unit||'—')}</b></td><td>${esc(x.paidFrom||'—')}</td><td>${esc(x.category||'—')}</td><td>${esc(x.description||'—')}</td><td>${money(x.amount)}</td><td><span class="statusBadge ${String(x.status).toLowerCase()==='closed'?'closed':'pending'}">${esc(x.status||'Pending')}</span></td><td class="rowDoc">${docButton(x.invoiceLink,'View document')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="detailEmpty">No reimbursement records for this month.</div>'}</div></div>`;
}

function maintenanceDetailRow(r, i, u){
  const due=Number(r.due)||0, paid=Number(r.paid)||0, balance=Math.max(0,due-paid);
  const st=paid>=due&&due>0?'Paid':paid>0?'Partial':'Pending';
  const receipt=r.receiptLink||r.documentLink||r.attachmentLink||'';
  return `<tr>
    <td><b>${esc(r.unit||'—')}</b><div class="cellSub">${esc(u?owner(u):'')}</div></td>
    <td>${money(due)}</td>
    <td>${money(paid)}</td>
    <td>${money(balance)}</td>
    <td>${esc(shortDate(r.paidDate)||'—')}</td>
    <td>${esc(r.mode||'—')}</td>
    <td><span class="statusBadge ${st==='Paid'?'closed':st==='Partial'?'partial':'pending'}">${st}</span></td>
    <td>${esc(r.notes||'—')}</td>
    <td class="rowDoc">${receipt?docButton(receipt,'View receipt'):'<span class="noDoc">—</span>'}</td>
  </tr>`;
}
function maintenanceDetails(m){
  const rows=(m.unitStatus||[]).slice().sort((a,b)=>String(a.unit).localeCompare(String(b.unit),undefined,{numeric:true}));
  const allUnits=DATA.units||[];
  const totalDue=rows.reduce((s,x)=>s+(+x.due||0),0);
  const totalPaid=rows.reduce((s,x)=>s+(+x.paid||0),0);
  const pending=Math.max(0,totalDue-totalPaid);
  const pct=totalDue?Math.min(100,Math.round(totalPaid/totalDue*100)):0;
  return `<div class="detailView"><div class="detailHead"><button class="backBtn" onclick="render(getMonth(selectedKey))">← Back to dashboard</button><div class="detailTitle"><h3>Maintenance Received</h3><p>${esc(m.label)} · Complete payment details</p></div></div>
  <div class="detailSummary"><div class="detailStat greenStat"><div class="k">Total due</div><div class="v">${money(totalDue)}</div></div><div class="detailStat greenStat"><div class="k">Total received</div><div class="v">${money(totalPaid)}</div></div><div class="detailStat redStat"><div class="k">Pending balance</div><div class="v">${money(pending)}</div></div></div>
  <div class="detailCard"><div class="detailCardHead"><h4>Maintenance payment register</h4><small>${rows.length} records · ${pct}% collected</small></div>
  ${rows.length?`<div class="detailTableWrap"><table class="detailTable maintenanceTable"><thead><tr><th>Unit / Owner</th><th>Due</th><th>Received</th><th>Balance</th><th>Payment Date</th><th>Mode</th><th>Status</th><th>Notes</th><th>Receipt</th></tr></thead><tbody>${rows.map((r,i)=>maintenanceDetailRow(r,i,allUnits.find(u=>String(u.UnitNo||u.unit||'').trim()===String(r.unit||'').trim()))).join('')}</tbody></table></div>`:'<div class="detailEmpty">No maintenance records for this month.</div>'}</div></div>`;
}
function renderDetail(m,type){
  const title=type==='maintenance'?'Maintenance Received':type==='expenses'?'Expenses Incurred':'Reimbursements';
  const subtitle=type==='maintenance'?'Complete maintenance payment register':type==='expenses'?'Complete expense records and attached documents':'Complete reimbursement records with pending / closed status';
  document.getElementById('title').textContent=title;
  document.getElementById('subtitle').textContent=subtitle;
  document.getElementById('content').innerHTML=type==='maintenance'?maintenanceDetails(m):type==='expenses'?expenseDetails(m):reimbursementDetails(m);
}
function shortDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}
function renderYear(y,rows){
 const opening=rows.length?Number(rows[0].openingBalance)||0:0;
 const received=rows.reduce((s,m)=>s+(Number(m.collected)||0),0);
 const spent=rows.reduce((s,m)=>s+(Number(m.spent)||0),0);
 const closing=rows.length?Number(rows[rows.length-1].closingBalance)||0:opening;
 document.getElementById('title').textContent=String(y)+' Annual Overview';
 document.getElementById('subtitle').textContent='Yearly maintenance, expenses and balance at a glance';
 document.getElementById('content').innerHTML=`<div class="detailView"><div class="balanceGrid">
 <div class="balanceCard opening"><div class="k">Opening balance</div><div class="v">${money(opening)}</div></div>
 <div class="balanceCard received"><div class="k">Maintenance received</div><div class="v">${money(received)}</div></div>
 <div class="balanceCard spent"><div class="k">Expenses incurred</div><div class="v">${money(spent)}</div></div>
 <div class="balanceCard closing"><div class="k">Closing balance</div><div class="v">${money(closing)}</div></div></div>
 <div class="detailCard"><div class="detailCardHead"><h4>${esc(y)} Monthly Summary</h4><small>${rows.length} months</small></div>
 ${rows.length?`<div class="detailTableWrap"><table class="yearTable"><thead><tr><th>Month</th><th>Opening</th><th>Maintenance Received</th><th>Expenses</th><th>Net</th><th>Closing</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.label)}</b></td><td>${money(m.openingBalance)}</td><td>${money(m.collected)}</td><td>${money(m.spent)}</td><td>${money((Number(m.collected)||0)-(Number(m.spent)||0))}</td><td><b>${money(m.closingBalance)}</b></td></tr>`).join('')}<tr class="total"><td>Year total</td><td>${money(opening)}</td><td>${money(received)}</td><td>${money(spent)}</td><td>${money(received-spent)}</td><td>${money(closing)}</td></tr></tbody></table></div>`:'<div class="detailEmpty">No records found for this year.</div>'}</div></div>`;
}

function render(m){
  if(!m){document.getElementById('content').innerHTML='<div class="empty">Select a month.</div>';return}
  document.getElementById('title').textContent=m.label; document.getElementById('subtitle').textContent='Unit-wise maintenance status, expenses and reimbursements';
  const collected=+m.collected||0, spent=+m.spent||0, reimbursement=(m.reimbursements||[]).filter(x=>String(x.status).toLowerCase()!=='closed').reduce((s,x)=>s+(+x.amount||0),0);
  document.getElementById('content').innerHTML=`<div class="balanceGrid"><div class="balanceCard opening"><div class="k">Opening balance</div><div class="v">${money(m.openingBalance)}</div></div><div class="balanceCard received"><div class="k">Maintenance received</div><div class="v">${money(collected)}</div></div><div class="balanceCard spent"><div class="k">Expenses incurred</div><div class="v">${money(spent)}</div></div><div class="balanceCard closing"><div class="k">Closing balance</div><div class="v">${money(m.closingBalance)}</div></div></div><div class="summary"><div class="stat green"><div class="label">Maintenance Received</div><div class="value">${money(collected)}</div><div class="sub">${(m.unitStatus||[]).filter(x=>(+x.paid||0)>=(+x.due||0)&&(+x.due||0)>0).length} fully paid units</div></div><div class="stat red"><div class="label">Expenses Incurred</div><div class="value">${money(spent)}</div><div class="sub">${(m.expenses||[]).length} expense entries</div></div><div class="stat purple"><div class="label">Reimbursements</div><div class="value">${money(reimbursement)}</div><div class="sub">${(m.reimbursements||[]).filter(x=>String(x.status).toLowerCase()!=='closed').length} pending · ${(m.reimbursements||[]).filter(x=>String(x.status).toLowerCase()==='closed').length} closed</div></div></div><div class="legend"><span><i class="dot green"></i> Paid</span><span><i class="dot red"></i> Pending / partial</span><span><i class="dot purple"></i> Reimbursement required</span></div><div class="unitsTitle"><h3>Units Overview</h3><small>Five units per floor</small></div>${units(m)}<div class="bottomGrid">${maintenancePanel(m)}${expensesPanel(m)}${reimbursePanel(m)}</div>`;
}
async function load(){
 try{
  const r=await fetch(API_URL+'?action=dashboard&v='+Date.now(),{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status); DATA=await r.json(); if(DATA.error)throw Error(DATA.error);
  const buildingNameEl=document.getElementById('buildingName'); if(buildingNameEl) buildingNameEl.textContent=DATA.buildingName||'Buildwick South Estate'; document.getElementById('asof').textContent='Updated '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  DATA.monthly=(DATA.monthly||[]).map(m=>({...m,key:m.key||monthKey(m.month),label:m.label||monthLabel(m.key||monthKey(m.month)),year:String((m.key||monthKey(m.month)).slice(0,4))})).filter(m=>m.key);
  nav(); if(DATA.monthly.length){selectedKey=DATA.monthly[0].key;nav();render(DATA.monthly[0])}else document.getElementById('content').innerHTML='<div class="empty">No monthly data found. Add months to MonthlyMaintenance or Expenses.</div>';
 }catch(e){document.getElementById('nav').innerHTML='<div class="error">Months could not be loaded.</div>';document.getElementById('content').innerHTML='<div class="error"><b>Could not load Google Sheet data.</b><br>'+esc(e.message)+'<br><br>Check the Apps Script Web App URL and deployment access.</div>'}
}
load();
</script>
</body>
</html>
