<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Building Passbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEEE8; --card: #FFFFFF; --rule: #DEDBD1; --ink: #1E2A28;
    --ink-soft: #5B665F; --surplus: #3F7D58; --deficit: #B5453B; --pocket: #C2822F;
    --serif: 'Lora', serif; --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-family: var(--serif); font-size: 20px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 22px; margin-bottom: 18px; }
  .card h2 { font-size: 14px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }
  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 12px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 3px;
    font-family: var(--sans); font-size: 14px; background: #fff; color: var(--ink);
  }
  textarea { resize: vertical; min-height: 50px; }
  button {
    margin-top: 16px; background: var(--ink); color: #fff; border: none; border-radius: 3px;
    padding: 10px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--sans);
  }
  button:hover { opacity: .9; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.ok { color: var(--surplus); } .msg.err { color: var(--deficit); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #lockScreen { max-width: 320px; margin: 80px auto; text-align: center; }
  #lockScreen input { margin-bottom: 10px; }
  #app { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <div id="lockScreen">
    <h1>Admin sign-in</h1>
    <input type="password" id="pw" placeholder="Admin password">
    <button onclick="unlock()">Enter</button>
    <div class="msg err" id="lockMsg"></div>
  </div>

  <div id="app">
    <h1>Building Passbook — Admin</h1>

    <div class="card">
      <h2>Set monthly maintenance due</h2>
      <label>Month</label>
      <input type="month" id="dueMonth">
      <label>Apply to</label>
      <select id="dueScope">
        <option value="all">All units</option>
        <option value="one">One unit</option>
      </select>
      <div id="dueUnitWrap" style="display:none;">
        <label>Unit no.</label>
        <input type="text" id="dueUnit" placeholder="e.g. 3C">
      </div>
      <label>Amount (₹)</label>
      <input type="number" id="dueAmount">
      <button onclick="setDue()">Save due amount</button>
      <div class="msg" id="dueMsg"></div>
    </div>

    <div class="card">
      <h2>Record a payment received</h2>
      <div class="row2">
        <div><label>Unit no.</label><input type="text" id="payUnit" placeholder="e.g. 3C"></div>
        <div><label>Month</label><input type="month" id="payMonth"></div>
      </div>
      <label>Amount received (₹)</label>
      <input type="number" id="payAmount">
      <div class="row2">
        <div><label>Date</label><input type="date" id="payDate"></div>
        <div><label>Mode</label>
          <select id="payMode"><option>UPI</option><option>Cash</option><option>Bank transfer</option><option>Cheque</option></select>
        </div>
      </div>
      <label>Notes (optional)</label>
      <input type="text" id="payNotes">
      <button onclick="recordPayment()">Save payment</button>
      <div class="msg" id="payMsg"></div>
    </div>

    <div class="card">
      <h2>Log an expense</h2>
      <div class="row2">
        <div><label>Date</label><input type="date" id="expDate"></div>
        <div><label>Month</label><input type="month" id="expMonth"></div>
      </div>
      <label>Category</label>
      <input type="text" id="expCategory" placeholder="e.g. Electrical, Housekeeping, Lift AMC">
      <label>Description</label>
      <input type="text" id="expDescription">
      <label>Amount (₹)</label>
      <input type="number" id="expAmount">
      <label>Paid from</label>
      <select id="expPaidFrom" onchange="toggleIndividual()">
        <option value="Fund">Building fund</option>
        <option value="individual">An individual's own pocket</option>
      </select>
      <div id="individualWrap" style="display:none;">
        <label>Their name / unit</label>
        <input type="text" id="expIndividual" placeholder="e.g. Ramesh (2B)">
      </div>
      <label>Invoice (optional)</label>
      <input type="file" id="expInvoice">
      <button onclick="addExpense()">Save expense</button>
      <div class="msg" id="expMsg"></div>
    </div>

    <div class="card">
      <h2>Settle a reimbursement</h2>
      <label>Date on the original expense</label>
      <input type="date" id="setDate">
      <label>Paid by (exact name used above)</label>
      <input type="text" id="setPaidFrom">
      <label>Amount (₹)</label>
      <input type="number" id="setAmount">
      <button onclick="settleReimbursement()">Mark settled</button>
      <div class="msg" id="setMsg"></div>
    </div>
  </div>
</div>

<script>
// ── SET THIS to your deployed Apps Script Web App URL ──
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
let PASSWORD = '';

function unlock() {
  PASSWORD = document.getElementById('pw').value;
  if (!PASSWORD) return;
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  // Real auth happens per-request; a wrong password just makes saves fail.
}

document.getElementById('dueScope').addEventListener('change', e => {
  document.getElementById('dueUnitWrap').style.display = e.target.value === 'one' ? 'block' : 'none';
});

function toggleIndividual() {
  document.getElementById('individualWrap').style.display =
    document.getElementById('expPaidFrom').value === 'individual' ? 'block' : 'none';
}

async function post(action, payload, msgEl) {
  msgEl.textContent = 'Saving…'; msgEl.className = 'msg';
  if (!API_URL || API_URL.startsWith('PASTE_')) {
    msgEl.textContent = 'Set API_URL at the top of the script first.'; msgEl.className = 'msg err';
    return null;
  }
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, password: PASSWORD, ...payload })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    msgEl.textContent = 'Saved.'; msgEl.className = 'msg ok';
    return data;
  } catch (err) {
    msgEl.textContent = 'Error: ' + err.message; msgEl.className = 'msg err';
    return null;
  }
}

function setDue() {
  const scope = document.getElementById('dueScope').value;
  post('setMonthlyDue', {
    month: document.getElementById('dueMonth').value,
    unitNo: scope === 'one' ? document.getElementById('dueUnit').value : null,
    amount: Number(document.getElementById('dueAmount').value)
  }, document.getElementById('dueMsg'));
}

function recordPayment() {
  post('recordPayment', {
    unitNo: document.getElementById('payUnit').value,
    month: document.getElementById('payMonth').value,
    amount: Number(document.getElementById('payAmount').value),
    date: document.getElementById('payDate').value,
    mode: document.getElementById('payMode').value,
    notes: document.getElementById('payNotes').value
  }, document.getElementById('payMsg'));
}

function addExpense() {
  const fileInput = document.getElementById('expInvoice');
  const paidFrom = document.getElementById('expPaidFrom').value === 'individual'
    ? document.getElementById('expIndividual').value : 'Fund';
  const basePayload = {
    date: document.getElementById('expDate').value,
    month: document.getElementById('expMonth').value,
    category: document.getElementById('expCategory').value,
    description: document.getElementById('expDescription').value,
    amount: Number(document.getElementById('expAmount').value),
    paidFrom
  };
  const msgEl = document.getElementById('expMsg');

  if (fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      post('addExpense', {
        ...basePayload,
        invoiceBase64: base64,
        invoiceFileName: file.name,
        invoiceMimeType: file.type
      }, msgEl);
    };
    reader.readAsDataURL(file);
  } else {
    post('addExpense', basePayload, msgEl);
  }
}

function settleReimbursement() {
  post('settleReimbursement', {
    date: document.getElementById('setDate').value,
    paidFrom: document.getElementById('setPaidFrom').value,
    amount: Number(document.getElementById('setAmount').value)
  }, document.getElementById('setMsg'));
}
</script>
</body>
</html>
